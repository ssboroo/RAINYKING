name: RAINY TRANSPARENCY CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Lint changed normalization tests
        run: ruff check backend/tests/test_normalization.py
      - name: Type-check normalization module
        run: mypy --ignore-missing-imports backend/app/normalization.py
      - name: Run backend tests
        run: pytest -q
        env:
          PYTHONPATH: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Build and type-check frontend
        run: npm run build
