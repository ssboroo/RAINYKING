services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transparency
      POSTGRES_USER: transparency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transparency -d transparency"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://transparency:${POSTGRES_PASSWORD}@db:5432/transparency
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      TENDER_BEARER_TOKEN: ${TENDER_BEARER_TOKEN:-}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:

  scheduler:
    build: ./backend
    command: ["python", "-m", "app.scheduler"]
    profiles: ["scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://transparency:${POSTGRES_PASSWORD}@db:5432/transparency
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      TENDER_BEARER_TOKEN: ${TENDER_BEARER_TOKEN:-}
      AUTO_SYNC_INTERVAL_MINUTES: ${AUTO_SYNC_INTERVAL_MINUTES:-360}
      AUTO_SYNC_SOURCES: ${AUTO_SYNC_SOURCES:-}
    depends_on:
      db: {condition: service_healthy}
